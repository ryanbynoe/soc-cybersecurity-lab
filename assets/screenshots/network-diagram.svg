<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#50c878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3aa65d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="siemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    SOC Tier 1 Lab - Network Topology
  </text>
  <text x="600" y="65" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Domain: corp.thinkfusion.com | Network: 10.0.0.0/24
  </text>
  
  <!-- Network backbone (switch/router representation) -->
  <rect x="500" y="350" width="200" height="60" rx="8" fill="#34495e" filter="url(#shadow)"/>
  <text x="600" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">
    Virtual Network
  </text>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#bdc3c7">
    VMware Workstation Pro 25H2
  </text>
  
  <!-- Connection lines from center -->
  <!-- To Domain Controller -->
  <line x1="600" y1="350" x2="600" y2="200" stroke="#34495e" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- To SIEM Server -->
  <line x1="500" y1="380" x2="200" y2="250" stroke="#34495e" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- To Corporate Server -->
  <line x1="700" y1="380" x2="1000" y2="250" stroke="#34495e" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- To Windows Client -->
  <line x1="550" y1="410" x2="300" y2="550" stroke="#34495e" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- To Linux Client -->
  <line x1="650" y1="410" x2="900" y2="550" stroke="#34495e" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Domain Controller (Top Center) -->
  <g>
    <rect x="500" y="100" width="200" height="90" rx="8" fill="url(#dcGrad)" filter="url(#shadow)"/>
    <circle cx="600" cy="130" r="15" fill="#fff" opacity="0.9"/>
    <text x="600" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#4a90e2">DC</text>
    <text x="600" y="158" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      thinkfusion
    </text>
    <text x="600" y="173" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ecf0f1">
      10.0.0.8
    </text>
    <text x="600" y="186" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">
      Windows Server 2025
    </text>
  </g>
  
  <!-- SIEM Server (Left) -->
  <g>
    <rect x="100" y="180" width="200" height="90" rx="8" fill="url(#siemGrad)" filter="url(#shadow)"/>
    <circle cx="200" cy="210" r="15" fill="#fff" opacity="0.9"/>
    <text x="200" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">⚠</text>
    <text x="200" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      thinkfusion-sec-work
    </text>
    <text x="200" y="253" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ecf0f1">
      10.0.0.10 | SIEM
    </text>
    <text x="200" y="266" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">
      Ubuntu 22.04.5 | Wazuh
    </text>
  </g>
  
  <!-- Enterprise Workstation (Right) -->
  <g>
    <rect x="900" y="180" width="200" height="90" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
    <circle cx="1000" cy="210" r="15" fill="#fff" opacity="0.9"/>
    <text x="1000" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#9b59b6">W</text>
    <text x="1000" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      CORP-SVR
    </text>
    <text x="1000" y="253" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ecf0f1">
      10.0.0.7
    </text>
    <text x="1000" y="266" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">
      Ubuntu 22.04.5
    </text>
  </g>
  
  <!-- Windows Client (Bottom Left) -->
  <g>
    <rect x="200" y="520" width="200" height="90" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
    <circle cx="300" cy="550" r="15" fill="#fff" opacity="0.9"/>
    <text x="300" y="556" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#9b59b6">W</text>
    <text x="300" y="578" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      WIN-CLI
    </text>
    <text x="300" y="593" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ecf0f1">
      10.0.0.100
    </text>
    <text x="300" y="606" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">
      Windows 11 Enterprise
    </text>
  </g>
  
  <!-- Linux Client (Bottom Right) -->
  <g>
    <rect x="800" y="520" width="200" height="90" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
    <circle cx="900" cy="550" r="15" fill="#fff" opacity="0.9"/>
    <text x="900" y="556" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#9b59b6">L</text>
    <text x="900" y="578" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      linux-client
    </text>
    <text x="900" y="593" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ecf0f1">
      10.0.0.102
    </text>
    <text x="900" y="606" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">
      Ubuntu 22.04.5
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 680)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Legend:
    </text>
    <rect x="0" y="10" width="30" height="20" rx="3" fill="url(#dcGrad)"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Domain Controller</text>
    
    <rect x="200" y="10" width="30" height="20" rx="3" fill="url(#siemGrad)"/>
    <text x="240" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">SIEM/Security Server</text>
    
    <rect x="400" y="10" width="30" height="20" rx="3" fill="url(#clientGrad)"/>
    <text x="440" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Workstation</text>
  </g>
  
  <!-- Specs Box -->
  <g transform="translate(700, 680)">
    <rect x="0" y="-5" width="450" height="90" rx="5" fill="#fff" opacity="0.8" filter="url(#shadow)"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      Lab Specifications:
    </text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • All systems: VMware Workstation Pro 25H2
    </text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • SIEM: Wazuh (Manager, Indexer, Dashboard)
    </text>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • Monitoring: 5 Endpoints | AD: 7 User Accounts
    </text>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • Tools: Docker, PowerShell, Active Directory
    </text>
  </g>
</svg>